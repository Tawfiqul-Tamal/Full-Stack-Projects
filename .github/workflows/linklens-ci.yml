name: LinkLens CI

on:
  push:
    branches: [main]
    paths: ["projects/linklens/**"]
  pull_request:
    paths: ["projects/linklens/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/linklens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
